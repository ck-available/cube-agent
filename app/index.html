<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' file: http: https: data:; img-src 'self' data: file: http: https:; style-src 'self' 'unsafe-inline'; connect-src *; font-src 'self' data:;">
<title>CubeAgent</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/agent.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.6 20.5 7v10L12 21.4 3.5 17V7z"/><path d="M3.7 7.1 12 12l8.3-4.9M12 12v9.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-mask" viewBox="0 0 24 24"><path d="M3 8h18v5a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z"/><path d="M8 12h.01M16 12h.01"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 8 4 4-4 4M12 16h7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></symbol>
    <symbol id="i-magnifier" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m19 19-4.3-4.3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 21.5 20H2.5z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 4h6M9 13h.01M15 13h.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-folder-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V9M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 10h11a5 5 0 0 1 0 10H9"/><path d="m7 6-4 4 4 4"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v6M15 3v6"/><path d="M6 9h12v3a6 6 0 0 1-12 0z"/><path d="M12 18v3"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><circle cx="7" cy="6" r="2.5"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="10" r="2.5"/><path d="M7 8.5v7M17 12.5c0 2-1.6 3.5-4 3.5H9"/></symbol>
    <symbol id="i-diff" viewBox="0 0 24 24"><path d="M7 4v10M4 11l3 3 3-3"/><path d="M17 20V10M14 13l3-3 3 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9l5.7 1.8-5.7 1.8L12 18l-1.8-5.4L4.5 10.8 10.2 9z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
    <symbol id="i-at" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 8.5v4.8a2.7 2.7 0 0 0 5 0V12a8.5 8.5 0 1 0-3.4 6.8"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 20 6v6c0 5-3.4 7.8-8 9-4.6-1.2-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ============ 左栏 ============ -->
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo"><svg class="ic"><use href="#i-cube"></use></svg></span>
      <span class="brand-name">CubeAgent</span>
    </div>

    <button id="btn-new-task" class="btn-outline btn-block">
      <svg class="ic ic-sm"><use href="#i-plus"></use></svg>新任务
      <kbd class="btn-kbd">Ctrl N</kbd>
    </button>

    <nav class="side-actions">
      <button id="nav-search" class="side-action">
        <svg class="ic ic-sm"><use href="#i-search"></use></svg>搜索
        <kbd class="side-kbd">Ctrl K</kbd>
      </button>
      <button id="nav-skills" class="side-action">
        <svg class="ic ic-sm"><use href="#i-mask"></use></svg>技能
      </button>
      <button id="nav-mcp" class="side-action">
        <svg class="ic ic-sm"><use href="#i-plug"></use></svg>连接器
      </button>
      <button id="nav-git" class="side-action">
        <svg class="ic ic-sm"><use href="#i-branch"></use></svg>版本
      </button>
    </nav>

    <div id="workspace-chip" class="workspace-chip" title="点击选择工作区目录">
      <svg class="ic ic-sm"><use href="#i-folder-open"></use></svg>
      <span id="workspace-chip-text">未选择工作区</span>
      <svg class="ic ic-sm ws-caret"><use href="#i-chevron"></use></svg>
    </div>

    <div class="search-box">
      <svg class="ic"><use href="#i-search"></use></svg>
      <input id="search-input" placeholder="搜索任务…">
    </div>

    <div class="side-tabs" role="tablist">
      <button class="side-tab active" data-list="task" role="tab">任务</button>
      <button class="side-tab" data-list="project" role="tab">项目</button>
    </div>

    <nav id="session-list"></nav>

    <div class="sidebar-footer">
      <button id="btn-masks" class="btn-ghost" title="助手面具">
        <svg class="ic ic-sm"><use href="#i-mask"></use></svg>
      </button>
      <button id="btn-theme" class="btn-ghost" title="切换主题">
        <svg class="ic ic-sm"><use href="#i-sun"></use></svg>
      </button>
      <button id="btn-settings" class="btn-ghost" title="设置">
        <svg class="ic ic-sm"><use href="#i-settings"></use></svg>
      </button>
    </div>
  </aside>

  <!-- ============ 中栏 ============ -->
  <main id="main">
    <header id="chat-header">
      <div class="title-wrap">
        <div id="chat-title">新任务</div>
        <div id="chat-subtitle"></div>
      </div>
      <div class="header-right">
        <button id="model-picker-btn" title="选择模型">
          <span id="current-model-label">选择模型</span>
          <svg class="ic ic-sm"><use href="#i-chevron"></use></svg>
        </button>
        <div class="select-wrap" title="运行模式">
          <select id="mode-select" class="select-sm">
            <option value="chat">聊天模式</option>
            <option value="agent">Agent 模式</option>
          </select>
        </div>
        <div class="select-wrap" title="权限档位（借鉴 Codex approval-policy）">
          <select id="perm-select" class="select-sm">
            <option value="suggest">建议模式</option>
            <option value="auto">自动模式</option>
            <option value="full">全自动</option>
          </select>
        </div>
        <button id="btn-panel" class="btn-icon" title="显示/隐藏详情面板">
          <svg class="ic ic-lg"><use href="#i-panel"></use></svg>
        </button>
      </div>
      <div id="model-dropdown" class="dropdown hidden">
        <div class="dropdown-search">
          <input id="model-search" placeholder="搜索模型…">
        </div>
        <div id="model-list"></div>
      </div>
    </header>

    <div id="banner" class="banner hidden"></div>

    <section id="messages"></section>

    <div id="welcome">
      <div class="welcome-logo"><svg class="ic"><use href="#i-cube"></use></svg></div>
      <h1 id="welcome-title">你好，接下来交给我吧</h1>
      <div class="welcome-sub" id="welcome-sub">选一个项目，说清你要什么，我直接动手改代码、跑命令、给结论</div>

      <div class="welcome-pills" id="welcome-pills"></div>

      <div id="welcome-masks" class="welcome-masks"></div>
      <div class="welcome-tip">
        <code>/</code> 命令 · <code>@</code> 引用文件 · <code>/context</code> 看上下文用量 ·
        <code>/compact</code> 压缩历史 · <code>Ctrl K</code> 命令面板
      </div>
    </div>

    <footer id="composer">
      <div id="ctx-meter" class="ctx-meter lv-ok" title="上下文占用">
        <div class="ctx-meter-bar"><div id="ctx-bar" class="ctx-bar-fill ok"></div></div>
        <span class="ctx-meter-text"><b id="ctx-pct">0%</b> · <span id="ctx-total">0</span> tokens</span>
        <div id="ctx-tip" class="ctx-tip"></div>
      </div>
      <div id="context-chips" class="context-chips"></div>
      <div id="queue-bar" class="queue-bar hidden"></div>
      <div id="edit-tip" class="edit-tip hidden"></div>
      <div id="mention-popup" class="mention-popup hidden"></div>
      <div id="command-popup" class="command-popup hidden"></div>
      <div class="composer-inner">
        <textarea id="input" placeholder="描述任务，例如：给 user.service.ts 补单元测试并跑通 npm test"></textarea>
        <div class="composer-btns">
          <button id="btn-stop" class="btn-stop hidden" title="停止本轮">
            <svg class="ic ic-sm"><use href="#i-stop"></use></svg><span>停止</span>
          </button>
          <button id="btn-send" class="btn-send" title="发送 (Enter)">
            <svg class="ic ic-sm"><use href="#i-play"></use></svg><span>发送</span>
          </button>
        </div>
      </div>
      <div class="composer-meta">
        <span id="meta-hint">Enter 发送 · Shift+Enter 换行 · @ 引用文件 · / 斜杠命令 · /context 看用量</span>
      </div>
    </footer>
  </main>

  <!-- ============ 右栏 ============ -->
  <aside id="detail-panel">
    <div class="panel-tabs" role="tablist">
      <button class="panel-tab active" data-tab="todo" title="Agent 的执行计划">计划</button>
      <button class="panel-tab" data-tab="files" title="本会话改动过的文件">文件</button>
      <button class="panel-tab" data-tab="diff" title="逐行查看改动">变更</button>
      <button class="panel-tab" data-tab="trace" title="会话事件流，可回滚">轨迹</button>
      <button class="panel-tab" data-tab="git" title="Git 分支与工作区状态">版本</button>
    </div>
    <div id="panel-todo" class="panel-body"></div>
    <div id="panel-files" class="panel-body hidden"></div>
    <div id="panel-diff" class="panel-body hidden"></div>
    <div id="panel-trace" class="panel-body hidden"></div>
    <div id="panel-git" class="panel-body hidden"></div>
    <div id="panel-stats" class="panel-stats"></div>
  </aside>
</div>

<!-- ============ 弹窗 ============ -->
<div id="modal-settings" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel modal-lg">
    <div class="modal-header">
      <span>设置</span>
      <button class="modal-close" data-close aria-label="关闭">
        <svg class="ic"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-nav">
        <div class="settings-nav-title">通用</div>
        <div class="settings-nav-item" data-tab="general">通用设置</div>
        <div class="settings-nav-item" data-tab="agent">Agent 运行时</div>
        <div class="settings-nav-item" data-tab="memory">长期记忆</div>
        <div class="settings-nav-item" data-tab="skills">技能</div>
        <div class="settings-nav-item" data-tab="mcp">MCP 服务</div>
        <div class="settings-nav-title">服务商</div>
        <div id="settings-provider-nav"></div>
      </div>
      <div id="settings-content" class="settings-content"></div>
    </div>
  </div>
</div>

<div id="modal-masks" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel modal-fit">
    <div class="modal-header">
      <span>助手面具</span>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button id="btn-add-mask" class="btn-outline">
          <svg class="ic ic-sm"><use href="#i-plus"></use></svg>新建
        </button>
        <button class="modal-close" data-close aria-label="关闭">
          <svg class="ic"><use href="#i-x"></use></svg>
        </button>
      </span>
    </div>
    <div class="modal-body"><div id="mask-grid" class="mask-grid"></div></div>
  </div>
</div>

<div id="modal-prompt" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel modal-sm">
    <div class="modal-header">
      <span id="prompt-title">输入</span>
      <button class="modal-close" data-close aria-label="关闭">
        <svg class="ic"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <input id="prompt-input" type="text">
      <textarea id="prompt-textarea" class="hidden" rows="10"></textarea>
      <div class="modal-actions">
        <button class="btn-outline" data-close>取消</button>
        <button id="prompt-ok" class="btn-primary">确定</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-skill" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel modal-md">
    <div class="modal-header">
      <span id="skill-modal-title">新建技能</span>
      <button class="modal-close" data-close aria-label="关闭">
        <svg class="ic"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>技能名</label>
        <input id="skill-name" type="text" placeholder="如 code-review">
      </div>
      <div class="form-group">
        <label>一句话说明（模型据此判断何时使用）</label>
        <input id="skill-desc" type="text" placeholder="如：审查代码改动，按正确性→安全性→性能顺序列问题">
      </div>
      <div class="form-group">
        <label>技能正文（Markdown）</label>
        <textarea id="skill-body" rows="12" placeholder="# 代码审查&#10;&#10;当用户要求 review 某文件时：&#10;1. 先读完整文件&#10;2. 按正确性 → 安全性 → 性能顺序列问题"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-outline" data-close>取消</button>
        <button id="skill-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-confirm" class="modal hidden">
  <div class="modal-panel modal-sm">
    <div class="modal-header">
      <span id="confirm-title">确认</span>
      <button class="modal-close" data-close aria-label="关闭">
        <svg class="ic"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="confirm-text"></div>
      <div class="modal-actions">
        <button class="btn-outline" data-close>取消</button>
        <button id="confirm-ok" class="btn-danger">确定</button>
      </div>
    </div>
  </div>
</div>

<div id="modal-palette" class="modal hidden">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel palette-panel">
    <div class="palette-head">
      <svg class="ic ic-sm"><use href="#i-search"></use></svg>
      <input id="palette-input" placeholder="输入命令、跳转到任务、切换设置…">
    </div>
    <div id="palette-list" class="palette-list"></div>
    <div class="palette-foot">↑↓ 选择 · Enter 执行 · Esc 关闭</div>
  </div>
</div>

<div id="toast"></div>

<script src="js/secret.local.js"></script>
<script src="js/bridge.js"></script>
<script src="js/markdown.js"></script>
<script src="js/store.js"></script>
<script src="js/context.js"></script>
<script src="js/memory.js"></script>
<script src="js/tools.js"></script>
<script src="js/providers.js"></script>
<script src="js/agent.js"></script>
<script>
/* 渲染进程启动期错误兜底：把异常挂到 window.__cubeBootError，
   便于端到端测试与截图脚本定位"界面空白"类问题（正常运行时不会触发）*/
window.__cubeBootError = null;
window.addEventListener("error", function (e) {
  if (!window.CubeApp) window.__cubeBootError = (e.message || "") + " @ " + (e.filename || "") + ":" + (e.lineno || "");
});
</script>
<script src="js/app.js"></script>
</body>
</html>
