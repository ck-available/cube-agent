name: Release

# 推送 v* 标签时自动构建三平台安装包并上传到 GitHub Release
# 使用方法：git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Windows：单文件便携版 + 绿色解压版（都不需要管理员权限）
      - name: Build Windows portable
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --publish never

      # 名字里的版本号要跟 exe/dmg/AppImage 保持一致（都不带 v 前缀）。
      # github.ref_name 是 "v0.4.0"，直接用会得到 CubeAgent-v0.4.0-...，
      # 与 electron-builder 产出的 CubeAgent-0.4.0-... 对不齐，
      # 同一页上两个 Windows 文件前缀不同会让用户困惑。
      - name: Package green (解压即用) zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:TAG_NAME -replace '^v', ''
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath "dist/CubeAgent-${ver}-win-x64-green.zip" -CompressionLevel Optimal
        env:
          TAG_NAME: ${{ github.ref_name }}

      # --universal：同时打包 x64 与 arm64 并合并成单一 app。
      # 不加这个的话，macos-latest（已是 arm64）只会产出 arm64 包，
      # 而 artifactName 承诺的是 mac-universal，会导致 Intel Mac 拿到跑不起来的包。
      # 本项目无原生模块（npmRebuild:false），合并是纯 JS 复制，风险很低。
      - name: Build macOS dmg (universal)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --universal --publish never
        env:
          # 未配置证书时跳过签名身份探测，避免构建被签名流程拖慢或中断
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          generate_release_notes: true

      - name: Upload artifacts (手动触发时)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cube-agent-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
